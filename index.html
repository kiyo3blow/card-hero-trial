<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード勇者の試練</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="polish.css">
</head>
<body>
  <div class="game">
    <header>
      <h1>カード勇者の試練</h1>
      <div class="badge-row">
        <div class="badge turn" id="turnBadge">プレイヤーのターン</div>
        <div class="badge stage" id="stageBadge">1体目</div>
      </div>
    </header>

    <main class="battlefield">
      <section class="fighter player" aria-label="プレイヤー">
        <div class="fighter-top">
          <span class="fighter-name">勇者</span>
          <span class="small-status">
            <span>デッキ <span id="deckCount">11</span>枚</span>
            <span>HP <span id="playerHp">30</span>/<span id="playerMaxHp">30</span></span>
          </span>
        </div>
        <div class="sprite-wrap">
          <div class="sprite hero-sprite" aria-hidden="true">
            <span class="hero-cape"></span>
            <span class="hero-head"></span>
            <span class="hero-hair"></span>
            <span class="hero-body"></span>
            <span class="hero-arm left"></span>
            <span class="hero-arm right"></span>
            <span class="hero-shield"></span>
            <span class="hero-sword"></span>
            <span class="ground-shadow"></span>
          </div>
        </div>
        <div class="status">
          <div class="hp-line">
            <span>プレイヤーHP</span>
            <span><span id="playerHpBig">30</span> / <span id="playerMaxHpBig">30</span></span>
          </div>
          <div class="bar" aria-hidden="true"><div class="fill" id="playerBar"></div></div>
          <div class="effect-line" id="playerEffect">カードを1枚えらぼう！</div>
        </div>
      </section>

      <section class="fighter enemy" id="enemyBox" aria-label="敵">
        <div class="fighter-top">
          <span class="fighter-name" id="enemyName">スライム</span>
          <span class="small-status">
            <span>攻撃 <span id="enemyAttack">4</span></span>
            <span>HP <span id="enemyHp">18</span>/<span id="enemyMaxHp">18</span></span>
          </span>
        </div>
        <div class="sprite-wrap">
          <div class="sprite enemy-sprite slime" id="enemySprite" aria-hidden="true">
            <span class="slime-body"></span>
            <span class="slime-shine"></span>
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="ground-shadow"></span>
          </div>
        </div>
        <div class="status">
          <div class="hp-line">
            <span>敵HP</span>
            <span><span id="enemyHpBig">18</span> / <span id="enemyMaxHpBig">18</span></span>
          </div>
          <div class="bar" aria-hidden="true"><div class="fill" id="enemyBar"></div></div>
          <div class="intent-line" id="enemyIntent">次の行動：攻撃</div>
          <div class="effect-line" id="enemyEffect">カードでたたかおう！</div>
        </div>
      </section>
    </main>

    <section class="bottom" aria-label="手札と記録">
      <div class="hand" id="hand"></div>
      <aside class="log" aria-live="polite">
        <div class="log-title">ぼうけんメモ</div>
        <div id="logMessages"></div>
        <button class="restart" id="restartButton" type="button">はじめから</button>
      </aside>
    </section>

    <div class="center-pop" id="centerPop" aria-hidden="true">
      <div class="pop-text" id="popText">スライムを倒した！</div>
    </div>

    <div class="reward-screen" id="rewardScreen" aria-hidden="true">
      <div class="reward-panel">
        <p class="reward-title">カードを1枚えらんでデッキに追加！</p>
        <div class="reward-cards" id="rewardCards"></div>
      </div>
    </div>

    <div class="start-screen" id="startScreen">
      <div class="start-panel">
        <p class="start-title">カード勇者の試練</p>
        <button class="start-button" id="startButton" type="button">ゲーム開始</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="polish.js"></script>
</body>
</html>
